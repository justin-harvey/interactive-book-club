# nginx for the Interactive Book Club self-host (M6). Serves the built game (dist/) and
# reverse-proxies the presence WebSocket at the SAME origin under /presence, so the client
# connects with no cross-origin config: PresenceClient resolves ws(s)://<host>/presence
# whenever the page isn't on localhost (see src/net/PresenceClient.ts resolveUrl()).

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/css application/javascript application/json image/svg+xml;

    # WebSocket upgrade plumbing: pass Connection: upgrade only when the client asked.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        root   /usr/share/nginx/html;
        index  index.html;

        # The presence server (other compose service, internal network only).
        # Must match the client's path exactly: PresenceClient connects to "/presence".
        location = /presence {
            proxy_pass         http://presence:8140;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_read_timeout 3600s;   # keep idle sockets open (presence is long-lived)
        }

        # Static game. SPA-style fallback so deep links still boot index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
