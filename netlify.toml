[build]
  command = "npm run build"
  publish = "dist"

# NOTE: Netlify serves the STATIC game only — there is no presence/social backend here,
# so chat/emotes/Now-Reading/other-players won't work on the Netlify deploy. Those need
# the self-hosted stack (docs/DEPLOY-M6.md). Netlify is fine as a solo/static preview.
[build.environment]
  NODE_VERSION = "22"
