<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <!-- Lock the viewport so iPad Safari can't pinch/double-tap zoom the game.
       viewport-fit=cover lets it fill past the notch/home-indicator area. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Interactive Book Club</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <script src="game.js"></script>
  <!-- GBA pixel font is self-hosted (see @font-face in index.css) so the game
       works fully offline with no Google Fonts dependency. -->
  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <div id="game-container">
    <div id="phaser-game"></div>
  </div>
  <div id="hud">
    <span class="hud-title">Interactive Book Club</span>
    <span><b>Tap</b> to walk · explore the town and step into buildings</span>
    <span>Step on a glowing <b>▲/▼</b> pad to enter or leave a building</span>
    <span>Visit the <b>Library</b> to read</span>
  </div>
</body>

</html>
